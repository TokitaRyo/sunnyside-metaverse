<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>AMPLIFIRE LIVE</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <!-- 管理者用のショー画面（大型ディスプレイ用）。入室中の人のゲーム画面をカメラで追いかけ、右に名前・スタンプ数・滞在時間などを出し、下に参加者のキャラを並べる。/admin/show から開く -->
    <div class="bg" aria-hidden="true">
      <div class="aurora a1"></div>
      <div class="aurora a2"></div>
      <div class="aurora a3"></div>
      <div class="dots"></div>
      <div class="bigmark">AMPLIFIRE</div>
    </div>

    <div class="layout">
      <header class="top">
        <div class="logo">AMPLIFIRE</div>
        <div class="live"><i></i>LIVE<b id="count">0</b><small>人が参加中</small></div>
      </header>

      <!-- 主役: 追いかけているプレイヤーのゲーム画面 -->
      <section class="world" id="world-wrap">
        <div id="world"></div>
        <div class="cam-tag" id="cam-tag"><i></i>ついせき中<b id="cam-name"></b></div>
        <!-- ランキング（参加者の画面と同じ中身。管理用 API から取る） -->
        <div class="rank" id="rank" hidden>
          <div class="rk-col"><h3>⏱ スタンプRTA</h3><ol id="rk-rta"></ol></div>
          <div class="rk-col"><h3>🗺 今日の出店めぐり</h3><ol id="rk-tour"></ol></div>
        </div>
        <div class="veil" id="loading"><b>ゲーム画面を よみこみ中…</b><span class="loadbar"><i id="load-bar"></i></span></div>
        <div class="veil" id="offline" hidden><b>つなぎなおしています…</b></div>
        <div class="wait" id="wait" hidden>
          <b>いま、だれも いないよ</b>
          <span>だれかが 入室すると、その人の画面を おいかけます</span>
        </div>
      </section>

      <!-- 右: 今の人の情報（入室画面のデザイン） -->
      <aside class="panel" id="stage">
        <div class="spot">
          <div class="rays"></div>
          <div class="rays r2"></div>
          <div class="ring r1"><i></i><i></i></div>
          <div class="ring r2"><i></i><i></i><i></i></div>
          <div class="ring r3"><i></i></div>
          <div class="halo"></div>
          <div class="orbit" id="orbit"></div>
          <div class="hero" id="hero-box"><canvas id="hero"></canvas></div>
          <div class="floor"></div>
        </div>
        <div class="plate" id="plate">
          <div class="name" id="name"></div>
          <div class="sub" id="sub"></div>
        </div>
        <div class="stats" id="stats">
          <div class="stat wide">
            <span>⭐ スタンプ</span>
            <b id="st-stamps">0<small id="st-total">/ 0</small></b>
            <i class="meter"><u id="st-meter"></u></i>
          </div>
          <div class="stat"><span>⏱ 滞在時間</span><b id="st-stay">0秒</b></div>
          <div class="stat"><span>💬 おしゃべり</span><b id="st-chats">0<small>回</small></b></div>
          <div class="stat wide"><span>📍 いまいる場所</span><b id="st-area" class="txt">-</b></div>
        </div>
        <div class="order" id="order"></div>
        <!-- 会場限定モードのとき: 入室用の QR（会場にいる人だけが入れる） -->
        <div class="venue" id="venue" hidden>
          <div class="venue-qr" id="venue-qr"></div>
          <span>スマホで読みとって 入室</span>
        </div>
      </aside>

      <!-- 下: 参加している人のキャラクター -->
      <footer class="strip" id="strip"></footer>
    </div>

    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="progress"><i id="bar"></i></div>

    <div class="ctl" id="ctl">
      <button id="c-prev" type="button" title="前の人（←）">◀</button>
      <button id="c-pause" type="button" title="一時停止／再開（スペース）">⏸</button>
      <button id="c-next" type="button" title="次の人（→）">▶</button>
      <label>切り替え <select id="c-interval"><option value="8000">8秒</option><option value="12000">12秒</option><option value="15000">15秒</option><option value="20000">20秒</option><option value="30000">30秒</option><option value="60000">60秒</option></select></label>
      <button id="c-shuffle" type="button" title="順番をばらばらにする（S）">🔀</button>
      <button id="c-names" type="button" title="下の一覧を出す／隠す（T）">👥</button>
      <button id="c-bubbles" type="button" title="ゲーム画面の発言のふきだしを出す／隠す（B）。既定は隠す">💬</button>
      <button id="c-rank" type="button" title="ランキングを出す／隠す（R）">🏆</button>
      <button id="c-full" type="button" title="全画面（F）">⛶</button>
    </div>
    <script type="module" src="/src/show/main.ts"></script>
  </body>
</html>
