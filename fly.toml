# fly.toml app configuration file generated for sunnyside-metaverse on 2026-09-26T11:04:08+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sunnyside-metaverse'
primary_region = 'nrt'

[build]

# 文化祭の当日: 合言葉の入り口を開けて、だれでも入れるようにする（docs/ADMIN.md §8）。
# 「関係者だけ」に戻すときは、この2行を消して（または SITE_LOCK = '1' にして）デプロイする。
[env]
  SITE_LOCK = '0'
  # 学内LAN（仙台高専。プロキシ wproxy.net.sendai-nct.ac.jp:8080 経由）の人は、全員が同じ出口IPから来る。
  # 「同じ回線」の制限（同時接続数・入室の頻度・同じ回線のチャット停止など）を、この範囲にはかけない（docs/ADMIN.md §10）
  TRUSTED_IPS = '133.104.0.0/16'
  # 万一、学校の出口IPが上の範囲の外でも、多人数が詰まらないように、当日は「同じ回線」の上限をゆるめる（既定は 50人・入室10回/分・予約20回/分）
  MAX_PER_IP = '100'
  MOD_JOIN_PER_MIN = '60'
  MOD_RESERVE_PER_MIN = '120'

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # 1つの部屋に、同時に100人以上が WebSocket でつながる。接続数の目安（soft）と上限（hard）を、人数より十分大きくしておく
  # （未指定だと soft_limit は 20 になり、多人数のとき、この機械を負荷が高いとみなして扱いが不安定になりうる）
  [http_service.concurrency]
    type = 'connections'
    soft_limit = 500
    hard_limit = 800

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
